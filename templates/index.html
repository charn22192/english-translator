<!DOCTYPE html>
<html>
<head>
    <title>Language Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 20px;
            max-width: 600px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        textarea, input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #0047cc;
        }
        .output {
            margin-top: 20px;
            padding: 15px;
            background: #e6f0ff;
            border-left: 5px solid #0066ff;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🌍 Translate Any Language to English</h2>

        <form method="POST">
            <textarea name="input_text" placeholder="Enter any language text here..." rows="5"></textarea>
            <button type="submit">Translate</button>
        </form>

        
        {% if translated_text %}
        <div class="output">
            <h3>Translated to English:</h3>
            <p>{{ translated_text }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
